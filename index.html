<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Website!</title>
 
 <style>
    body {
        font-family: Arial, sans-serif;
        background-color: #eef5fc;
        color: #354b65;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #c5ddf5;
        color: #315b85;
        text-align: center;
        padding: 30px;
    }

    main {
        background-color: white;
        max-width: 800px;
        margin: 30px auto;
        padding: 25px;
        border-radius: 10px;
    }

    h2 {
        color: #5284b5;
    }

    p {
        line-height: 1.6;
    }

    .gallery {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 20px;
    }

    .gallery img {
        width: 220px;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        border: 3px solid #c5ddf5;
    }

    footer {
        background-color: #c5ddf5;
        color: #315b85;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
    }
 </style>

</head> 
<body>
 <header>
        <h1>group website!</h1>
    </header>
 <img src="cheyenne.jpg" alt="fav album">
</body>
