<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Website!</title>
 
 
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #faf3ed;
        color: #59423e;
        margin: 0;
        padding: 0;
    }

    header {
        background-color: #e8c5bd;
        color: #873f3a;
        text-align: center;
        padding: 30px;
    }

    main {
        background-color: #fffaf5;
        max-width: 800px;
        margin: 30px auto;
        padding: 25px;
        border-radius: 10px;
    }

    h2 {
        color: #a6534c;
    }

    p {
        line-height: 1.6;
    }

    .gallery {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-top: 20px;
    }

    .gallery img {
        width: 220px;
        height: 220px;
        object-fit: cover;
        border-radius: 10px;
        border: 3px solid #e8c5bd;
    }

    footer {
        background-color: #e8c5bd;
        color: #873f3a;
        text-align: center;
        padding: 15px;
        margin-top: 30px;
    }
</style>


</head> 
<body>
 <header>
        <h1>group website!</h1>
    </header>
 <main>
        <h2>Our Favorite Albums</h2>

        <div class="gallery">
         <div style="display: flex; flex-direction: column; align-items: center;">
          <a href="https://cheyennnehassan.github.io/" style="color: pink; text-decoration: none;">Cheyenne's Website ❤️</a>
</div>
            <img src="cheyenne.jpg" alt="Favorite album">
        </div>
    </main>

    <footer>
        <p>Group Website!</p>
    </footer>
</body>
